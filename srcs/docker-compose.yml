services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    image: nginx:1.0
    restart: unless-stopped
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress_volume:/var/www/html:ro
    depends_on:
      wordpress:
        condition: service_healthy
    
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    image: wordpress:1.0
    restart: unless-stopped
    env_file: .env
    networks:
      - inception
    volumes:
      - wordpress_volume:/var/www/html
    secrets:
      - db_password
      - wp_user_password
      - wp_admin_password
    healthcheck:
      test: "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""
      interval: 40s
      timeout: 40s
      retries: 5
    depends_on:
      mariadb:
        condition: service_healthy
  
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    image: mariadb:1.0
    restart: unless-stopped
    env_file: .env
    networks:
      - inception
    volumes:
      - mariadb_volume:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
    healthcheck:
      test: "mariadb-admin ping -u root --password=$(cat /run/secrets/db_root_password)"
      interval: 40s
      timeout: 40s
      retries: 5
   
networks:
  inception:
    driver: bridge

volumes:
  mariadb_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ayel-bou/data/mariadb
  
  wordpress_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ayel-bou/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt