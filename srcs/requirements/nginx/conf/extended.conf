server 
{
    listen 443 ssl;
    server_name ayel-bou.42.fr;

    ssl_certificate /etc/nginx/ssl/ayel-bou.cer;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3

    root /var/www/html;

    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}